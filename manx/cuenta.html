<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — Craft & Beer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/@tailwindcss/browser@4.3.3/dist/index.global.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/style.css">

  <style type="text/tailwindcss">
    @theme {
      --font-display: 'Fredoka', system-ui, sans-serif;
      --ambar: #FFB100;
      --ambar-suave: #FFE29A;
      --naranja: #FF6B4A;
      --teal: #1FAE93;
      --purpura: #8B4FE3;
      --tinta: #2B1B12;
      --tinta-suave: #7A6A5D;
      --crema: #FFF8EA;
    }
    body { background-color: var(--crema); color: var(--tinta); font-family: 'Nunito', system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- Sprite de íconos (reemplaza los emojis) -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
    <defs>
      <symbol id="icon-mug" viewBox="0 0 24 24">
        <path d="M5 7h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7Z"></path>
        <path d="M15 9h2.5a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H15"></path>
        <path d="M7 7V5.5A1.5 1.5 0 0 1 8.5 4H12"></path>
        <line x1="6.5" y1="10" x2="13.5" y2="10"></line>
      </symbol>
    </defs>
  </svg>

  <!-- Header -->
  <header class="w-full bg-white/90 backdrop-blur shadow-sm sticky top-0 z-50">
    <div class="mx-auto max-w-[1280px] px-6 h-[70px] flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 font-display text-xl md:text-2xl tracking-tight text-[var(--tinta)]">
        <svg class="icon icon-lg text-[var(--naranja)]"><use href="#icon-mug"></use></svg>
        Craft <span class="text-[var(--naranja)]">&</span> Beer
      </a>
      <div class="flex items-center gap-5">
        <a href="cuenta.html" class="text-[var(--naranja)] font-bold text-sm hidden sm:inline">Mi cuenta</a>
        <a href="productos.html" class="flex items-center gap-2 text-sm font-bold hover:text-[var(--naranja)] transition-colors">
          <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="18"><path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4z"></path><path d="M4 6h16"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          Productos
        </a>
      </div>
    </div>
  </header>

  <main class="min-h-[75vh] flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-[440px] bg-white rounded-3xl shadow-xl p-8 md:p-10">
      <div class="flex justify-center mb-4">
        <svg class="icon icon-xl text-[var(--naranja)]"><use href="#icon-mug"></use></svg>
      </div>
      <p class="text-center font-display text-[var(--naranja)] text-sm uppercase tracking-wide mb-1">Club Cervecero</p>
      <h1 class="text-center font-display text-3xl text-[var(--tinta)] mb-2">Iniciar sesión</h1>
      <p class="text-center text-[var(--tinta-suave)] mb-8">Ingresa para ver tus CraftPoints y pedidos.</p>

      <form id="formLogin" class="space-y-5">
        <div>
          <label for="correo" class="block text-sm font-bold mb-1.5">Correo electrónico</label>
          <input type="email" id="correo" placeholder="correo@ejemplo.com" required
            class="w-full rounded-xl border-2 border-black/10 px-4 py-2.5 outline-none focus:border-[var(--naranja)] transition-colors">
        </div>

        <div>
          <label for="password" class="block text-sm font-bold mb-1.5">Contraseña</label>
          <input type="password" id="password" placeholder="Ingresa tu contraseña" required
            class="w-full rounded-xl border-2 border-black/10 px-4 py-2.5 outline-none focus:border-[var(--naranja)] transition-colors">
        </div>

        <button type="submit" class="w-full rounded-full bg-[var(--naranja)] text-white font-bold py-3 hover:bg-[var(--tinta)] transition-colors cursor-pointer">
          Iniciar sesión
        </button>
      </form>

      <p id="mensajeLogin" class="mt-4 text-center font-bold"></p>

      <div class="mt-8 text-center">
        <a href="index.html" class="inline-flex items-center gap-2 text-sm font-bold text-[var(--tinta-suave)] hover:text-[var(--naranja)] transition-colors">
          ← Volver al inicio
        </a>
      </div>
    </div>
  </main>

  <footer class="bg-[var(--tinta)] py-8 text-center">
    <p class="text-white/40 text-xs">Craft & Beer® — Bebe con responsabilidad.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
