# PR 9 — Craft & Beer completo
#   docker compose up --build
# Abrir http://localhost:8080
# La clave del admin aparece en el log de "vault-init"
# (o fíjala tú: ADMIN_PASSWORD=miclave docker compose up --build)

services:
  vault:
    image: hashicorp/vault:1.17
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root-dev-craftbeer}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  vault-init:
    image: hashicorp/vault:1.17
    depends_on: [vault]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root-dev-craftbeer}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes: ["./vault/cargar_secretos.sh:/cargar_secretos.sh:ro"]
    entrypoint: ["/bin/sh", "/cargar_secretos.sh"]
    restart: "no"

  catalogo:
    build: ./catalogo
    environment: &vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root-dev-craftbeer}
    depends_on:
      vault-init: { condition: service_completed_successfully }

  pedidos:
    build: ./pedidos
    environment: *vault
    depends_on:
      vault-init: { condition: service_completed_successfully }

  auth:
    build: ./auth
    environment: *vault
    depends_on:
      vault-init: { condition: service_completed_successfully }

  gateway:
    build: ./gateway
    environment:
      <<: *vault
      CATALOGO_URL: http://catalogo:8001
      PEDIDOS_URL: http://pedidos:8002
      AUTH_URL: http://auth:8003
      ORIGENES_PERMITIDOS: http://localhost:8080,http://127.0.0.1:8080
      COOKIE_SEGURA: "false"   # true cuando haya https
    depends_on: [catalogo, pedidos, auth]
    ports: ["8000:8000"]

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gateway]
    ports: ["8080:80"]
