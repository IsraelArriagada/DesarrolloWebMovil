# nginx sirve el frontend y reenvía /api y /auth al gateway.
# Así navegador, frontend y API quedan en el MISMO origen (localhost:8080)
# y la cookie de sesión funciona sin pelear con CORS.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(api|auth|health) {
    proxy_pass http://gateway:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
