<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Craft & Beer</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@tailwindcss/browser@4.3.3/dist/index.global.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/style.css">
  <style type="text/tailwindcss">
    @theme {
      --font-display: 'Fredoka', system-ui, sans-serif;
      --ambar: #FFB100; --ambar-suave: #FFE29A; --naranja: #FF6B4A; --teal: #1FAE93; --purpura: #8B4FE3;
      --tinta: #2B1B12; --tinta-suave: #7A6A5D; --crema: #FFF8EA;
    }
    body { background-color: var(--crema); color: var(--tinta); font-family: 'Nunito', system-ui, sans-serif; }
  </style>
</head>
<body>
  <header id="header"></header>

  <main id="panel" class="hidden mx-auto max-w-[1200px] px-6 py-10 space-y-10">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="font-display text-3xl">Panel de administración</h1>
      <p id="estadoServicios" class="text-xs font-bold"></p>
    </div>

    <section id="resumen" class="grid gap-4 grid-cols-2 md:grid-cols-5"></section>

    <div class="grid gap-8 lg:grid-cols-[1.4fr_1fr]">
      <section class="bg-white rounded-2xl shadow-sm p-6">
        <h2 class="font-display text-2xl mb-4">Stock</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-left text-[var(--tinta-suave)]">
              <tr><th class="py-2">Cerveza</th><th>Estilo</th><th class="text-right">Precio</th><th class="text-right">Stock</th><th class="text-right">Reponer</th></tr>
            </thead>
            <tbody id="tablaCervezas"></tbody>
          </table>
        </div>
      </section>

      <section class="bg-white rounded-2xl shadow-sm p-6">
        <h2 class="font-display text-2xl mb-4">Nueva cerveza</h2>
        <form id="formCerveza" class="space-y-3">
          <input name="nombre" placeholder="Nombre (ej: Hazy IPA)" class="w-full rounded-xl border-2 border-black/10 px-4 py-2 outline-none focus:border-[var(--naranja)]">
          <select name="estilo" class="w-full rounded-xl border-2 border-black/10 px-3 py-2 bg-white">
            <option>IPA</option><option>STOUT</option><option>PORTER</option><option>LAGER</option><option>WHEAT</option><option>RED_ALE</option>
          </select>
          <div class="grid grid-cols-2 gap-3">
            <input name="precio" type="number" min="1" placeholder="Precio" class="rounded-xl border-2 border-black/10 px-4 py-2 outline-none focus:border-[var(--naranja)]">
            <input name="stock" type="number" min="0" placeholder="Stock" class="rounded-xl border-2 border-black/10 px-4 py-2 outline-none focus:border-[var(--naranja)]">
          </div>
          <button class="w-full rounded-full bg-[var(--naranja)] text-white font-bold py-2.5 hover:bg-[var(--tinta)] transition-colors cursor-pointer">Agregar al catálogo</button>
          <p id="msgCerveza" class="text-sm font-bold"></p>
        </form>
      </section>
    </div>

    <section class="bg-white rounded-2xl shadow-sm p-6">
      <h2 class="font-display text-2xl mb-4">Pedidos</h2>
      <div id="listaPedidos" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
