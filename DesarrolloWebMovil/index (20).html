<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craft & Beer — Tienda</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@tailwindcss/browser@4.3.3/dist/index.global.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/style.css">
  <style type="text/tailwindcss">
    @theme {
      --font-display: 'Fredoka', system-ui, sans-serif;
      --ambar: #FFB100; --ambar-suave: #FFE29A; --naranja: #FF6B4A; --teal: #1FAE93; --purpura: #8B4FE3;
      --tinta: #2B1B12; --tinta-suave: #7A6A5D; --crema: #FFF8EA;
    }
    body { background-color: var(--crema); color: var(--tinta); font-family: 'Nunito', system-ui, sans-serif; }
  </style>
</head>
<body>
  <header id="header"></header>

  <section class="bg-gradient-to-br from-[var(--ambar)] to-[var(--naranja)] relative overflow-hidden">
    <span class="burbuja w-4 h-4 left-[15%]"></span>
    <span class="burbuja w-6 h-6 left-[60%]" style="animation-delay:1.2s"></span>
    <span class="burbuja w-3 h-3 left-[85%]" style="animation-delay:2s"></span>
    <div class="relative mx-auto max-w-[1200px] px-6 py-14">
      <h1 class="font-display text-4xl md:text-5xl text-white mb-2">Elige, pide y salud.</h1>
      <p class="text-white/90 text-lg">Stock en vivo desde nuestro catálogo. Despacho gratis sobre $25.000.</p>
    </div>
  </section>

  <main class="mx-auto max-w-[1200px] px-6 py-12">
    <div id="filtros" class="flex flex-wrap justify-center gap-2.5 mb-10"></div>
    <p id="estadoCatalogo" class="text-center text-[var(--tinta-suave)]">Cargando cervezas…</p>
    <div id="gridCervezas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7"></div>
  </main>

  <footer class="bg-[var(--tinta)] py-8 text-center">
    <p class="text-white/40 text-xs">Craft & Beer® — Bebe con responsabilidad. Venta solo a mayores de 18 años.</p>
  </footer>

  <!-- Carrito -->
  <aside id="carritoPanel" class="fixed top-0 right-0 w-full md:w-[400px] h-full bg-white shadow-2xl z-[100] transform translate-x-full transition-transform duration-300 p-6 flex flex-col">
    <div class="flex justify-between items-center border-b border-black/5 pb-4 mb-4">
      <h2 class="font-display text-2xl">Tu pedido</h2>
      <button id="cerrarCarrito" class="text-gray-400 hover:text-[var(--naranja)] font-bold text-xl cursor-pointer" aria-label="Cerrar">✕</button>
    </div>
    <div id="contenidoCarrito" class="flex-grow overflow-y-auto"></div>
    <form id="formCheckout" class="pt-4 border-t border-black/5 space-y-3 hidden">
      <div class="flex justify-between font-display text-xl"><span>Total</span><span id="totalCarrito" class="text-[var(--naranja)]"></span></div>
      <p id="notaEnvio" class="text-xs text-[var(--tinta-suave)]"></p>
      <input id="direccion" placeholder="Dirección de despacho" class="w-full rounded-xl border-2 border-black/10 px-4 py-2.5 outline-none focus:border-[var(--naranja)]">
      <button class="w-full rounded-full bg-[var(--naranja)] text-white font-bold py-3 hover:bg-[var(--tinta)] transition-colors cursor-pointer">Confirmar pedido</button>
      <p id="msgCheckout" class="text-sm font-bold text-center"></p>
    </form>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
