# Semana 8 — Craft & Beer con Vault
#   docker compose up --build
# Las API keys de tienda y admin se pueden fijar con variables de entorno
# (ej. API_KEY_ADMIN=miclave docker compose up); si no, Vault genera unas al azar
# y se ven en el log de "vault-init".

services:
  vault:
    image: hashicorp/vault:1.17
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root-dev-craftbeer}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  vault-init:
    image: hashicorp/vault:1.17
    depends_on: [vault]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root-dev-craftbeer}
      API_KEY_TIENDA: ${API_KEY_TIENDA:-}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-}
    volumes: ["./vault/cargar_secretos.sh:/cargar_secretos.sh:ro"]
    entrypoint: ["/bin/sh", "/cargar_secretos.sh"]
    restart: "no"

  catalogo:
    build: ./catalogo
    environment: &vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root-dev-craftbeer}
    depends_on:
      vault-init: { condition: service_completed_successfully }
    # Sin "ports": solo se puede llegar a él desde la red interna (vía gateway)

  pedidos:
    build: ./pedidos
    environment: *vault
    depends_on:
      vault-init: { condition: service_completed_successfully }

  gateway:
    build: ./gateway
    environment:
      <<: *vault
      CATALOGO_URL: http://catalogo:8001
      PEDIDOS_URL: http://pedidos:8002
      ORIGENES_PERMITIDOS: http://localhost:8080,http://127.0.0.1:8080
    depends_on: [catalogo, pedidos]
    ports: ["8000:8000"]

  frontend:
    image: nginx:alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
